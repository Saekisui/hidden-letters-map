  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Songti SC", "STSong", "Noto Serif SC", serif; -webkit-font-smoothing: antialiased; }

  .btn { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 22px; border-radius: 12px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 15px; letter-spacing: 0.2em; box-shadow: 0 8px 18px rgba(168, 107, 119, 0.32); }
  .btn:active { transform: scale(0.98); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid #d2bfb9; box-shadow: none; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .en { font: italic 500 15px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: 0.06em; color: var(--muted); }
  footer { margin-top: 40px; font: 500 12px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: 0.28em; text-transform: uppercase; color: #b8a5a9; }
